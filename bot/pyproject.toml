[project]
name = "duty-helper-bot"
version = "0.1.0"
description = "Бот дежурного QA FactSet: Bolt, Socket Mode"
requires-python = ">=3.13,<4.0"
dependencies = [
    "slack-bolt (>=1.21,<2.0)",
    "slack-cli-hooks<1.0.0",
    "google-genai (>=1.0,<2.0)",
]

[tool.setuptools.packages.find]
include = ["duty_bot*"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
