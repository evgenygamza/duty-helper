display_information:
  name: duty-helper
  description: Помощник дежурного QA — проверка механики в песочнице
  background_color: "#1c2027"

features:
  bot_user:
    display_name: duty-helper
    always_online: false

oauth_config:
  scopes:
    bot:
      # писать, править и удалять свои сообщения
      - chat:write
      # открыть личку, чтобы пинговать дежурного
      - im:write
      # статусы реакциями, включая снятие
      - reactions:read
      - reactions:write
      # видеть список каналов и находить их по имени. Отдельно от history:
      # history даёт сообщения, read — сам факт существования канала
      - channels:read
      - groups:read
      - im:read
      # читать сообщения в каналах, где состоит бот
      - channels:history
      - groups:history
      # вступать в публичные каналы самому, без ручного инвайта
      - channels:join
      # создавать каналы: нужно только в песочнице, чтобы собрать обстановку
      # для тестов. В рабочий воркспейс это право просить не надо
      - channels:manage
      # находить людей по рабочей почте
      - users:read
      - users:read.email
      # трекер обращений
      - lists:read
      - lists:write
      # состав групп — на случай возврата к ротации @qa-factset-dutyman
      - usergroups:read
      - usergroups:write
      # поиск по воркспейсу для приложения: новый путь вместо search.messages,
      # который боту недоступен. Если манифест их не примет — убрать и
      # полагаться на user-токен ниже
      - search:read.public
      - search:read.private
    user:
      # сбор упоминаний по всему пространству. search.messages работает только
      # с user-токеном: бот воркспейс не ищет, это ограничение Slack, а не прав
      - search:read

settings:
  org_deploy_enabled: false
  # реальное время: бот держит вебсокет сам, публичный адрес не нужен
  socket_mode_enabled: true
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      # сообщения в каналах, где состоит бот. Именно отсюда прилетают
      # упоминания группы — поиск по воркспейсу для realtime не нужен
      - message.channels
      - message.groups
      # упоминания самого приложения
      - app_mention
      # реакции как кнопки: 🎫 завести тикет, ✅ закрыть
      - reaction_added
      - reaction_removed
