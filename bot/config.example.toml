# Настройки бота дежурного. Значения здесь выдуманные — это образец.
#
# Рабочий файл кладётся в ~/.config/duty-helper/duty.toml (или куда укажет
# DUTY_CONFIG) и в репозиторий не попадает. Секретов тут нет вовсе: токены и
# пароли живут отдельно, в ~/.config/duty-helper/secrets.env.
#
# Любую настройку можно перебить переменной окружения — она сильнее файла.
# Имя переменной указано рядом с каждой.

[slack]
# Группа, по тегу которой приходят призывы. DUTY_GROUP_ID
group = "S00000000000"
# Куда бот пишет об отказах и где держит закреплённый реестр. DUTY_FEED_CHANNEL
feed_channel = "C00000000000"
# Доска-очередь, она же файл Slack List. DUTY_LIST_ID
list_id = "F00000000000"

[sweep]
# Как часто идёт обход, секунды. Рабочее значение ~120, тестовое 15.
# DUTY_SWEEP_SECONDS
seconds = 300
# Точка отсчёта: дата, «30d» или пусто. Пусто значит «с этого запуска», и тогда
# простой теряется, поэтому на проде задавать датой. DUTY_SINCE
since = "2026-01-01"
# Модификаторы поиска Slack, дописываются к запросу как есть.
# Пример: "-from:zabbix -in:#deploy". DUTY_SEARCH_FILTER
search_filter = ""
# Смотреть и ничего не трогать: каждая запись проговаривается в лог. DUTY_DRY_RUN
dry_run = false

[duty]
# Кому идут напоминания вместо участников группы. Пусто — по группе.
# Заполняется на время обкатки, чтобы ничего не долетело до живого дежурного.
# DUTY_USER_ID
user = ""

[outward]
# Письма вендору и тикеты уходят наружу только при true. По умолчанию всё
# пишется в файл. DUTY_SEND_OUTWARD
send = false

[vendor]
# Портал обращений поставщика данных. DUTY_PORTAL_URL
portal = "https://issuetracker.example.com"
# Где лежат учётка портала и сохранённая сессия. Пусто — ~/.factset-letters.
# FACTSET_LETTERS_HOME
home = ""

[jira]
# Проект и тип задачи, которой заводится инцидент.
project = "ITSM"
issue_type = "Incident"

[jira.fields]
# Идентификаторы полей вашей Jira: у каждой компании свои.
request_type = "customfield_10000"
environment = "customfield_10001"
detected_by = "customfield_10002"
team = "customfield_10003"
